name: Monitoring report checks
on:
  pull_request:
    paths:
      - 'src/reports.js'
      - 'src/main.js'
      - 'supabase/functions/monitoring-reports/**'
      - 'supabase/functions/monitoring-api/**'
      - 'supabase/migrations/20261020000*.sql'
      - 'tests/monitoring-reports.test.mjs'
      - '.github/workflows/monitoring-report-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/reports.js
      - name: Regression and report tests
        run: npm test
      - name: Verify pinned tus browser bundle exists
        run: |
          curl --fail --location --retry 3 --silent --show-error --max-time 30 \
            'https://cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js' \
            --output /tmp/osan-tus-browser.min.js
          test "$(wc -c </tmp/osan-tus-browser.min.js)" -gt 20000
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Function type check
        run: |
          deno check --node-modules-dir=auto supabase/functions/monitoring-reports/index.ts
          deno check --node-modules-dir=auto supabase/functions/monitoring-api/index.ts
      - name: Deployed reporting API rejects anonymous callers
        env:
          REPORT_API_URL: https://irqovqzrdvqmuuuvxcmt.supabase.co/functions/v1/monitoring-reports
          SCHEDULER_API_URL: https://irqovqzrdvqmuuuvxcmt.supabase.co/functions/v1/monitoring-api
        run: node --test tests/monitoring-api-live.test.mjs
